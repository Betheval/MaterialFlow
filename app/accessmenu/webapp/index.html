<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>MaterialFlow</title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://sapui5.hana.ondemand.com/1.139.0/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resourceroots='{
            "accessmenu": "./",
            "materials": "/materials/webapp",
            "suppliers": "/suppliers/webapp",
            "categories": "/categories/webapp",
            "purchaseorder": "/purchaseorder/webapp",
            "inventorymovement": "/inventorymovement/webapp"
        }'
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compatVersion="edge"
        data-sap-ui-async="true"
        data-sap-ui-frameOptions="trusted"
        data-sap-ui-xx-componentPreload="off"
        data-sap-ui-xx-viewCache="false"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="accessmenu"
        data-id="container"
        data-settings='{"id" : "accessmenu"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
